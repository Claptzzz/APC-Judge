# Infraestructura local de juez-online. Usar vía `pnpm infra:up | infra:down | infra:reset`
# (infra/scripts/compose.sh pasa --env-file .env o .env.example).
# Los contenedores *-init crean topics/bucket (idempotente), dejan /tmp/ready y quedan en
# espera; su healthcheck revisa esa marca, así `up --wait` espera a que terminen.
name: juez

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev}
      USERS_DB_NAME: ${USERS_DB_NAME:-users}
      USERS_DB_USER: ${USERS_DB_USER:-users_svc}
      USERS_DB_PASSWORD: ${USERS_DB_PASSWORD:-users_svc_dev}
      PROBLEMS_DB_NAME: ${PROBLEMS_DB_NAME:-problems}
      PROBLEMS_DB_USER: ${PROBLEMS_DB_USER:-problems_svc}
      PROBLEMS_DB_PASSWORD: ${PROBLEMS_DB_PASSWORD:-problems_svc_dev}
      SUBMISSIONS_DB_NAME: ${SUBMISSIONS_DB_NAME:-submissions}
      SUBMISSIONS_DB_USER: ${SUBMISSIONS_DB_USER:-submissions_svc}
      SUBMISSIONS_DB_PASSWORD: ${SUBMISSIONS_DB_PASSWORD:-submissions_svc_dev}
      RANKING_DB_NAME: ${RANKING_DB_NAME:-ranking}
      RANKING_DB_USER: ${RANKING_DB_USER:-ranking_svc}
      RANKING_DB_PASSWORD: ${RANKING_DB_PASSWORD:-ranking_svc_dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # Desde postgres 18 la imagen declara el volumen en /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      # Por TCP: durante el init el servidor temporal solo escucha en el socket unix,
      # así el contenedor no queda healthy antes de que termine init-databases.sh.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d postgres']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:8.10.3-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.4.0
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-djrZ_aKCR1mfxvzfoWCiMw}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL: red de docker (kafka:29092) · EXTERNAL: host (localhost:9092)
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - '${KAFKA_HOST_PORT:-9092}:9092'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1',
        ]
      interval: 10s
      timeout: 15s
      retries: 15
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.4.0
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_TOPIC_PARTITIONS: 3
    volumes:
      - ./kafka/create-topics.sh:/scripts/create-topics.sh:ro
    entrypoint: ['/bin/bash', '/scripts/create-topics.sh']
    healthcheck:
      test: ['CMD', 'test', '-f', '/tmp/ready']
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    depends_on:
      kafka-init:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: juez-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - '${KAFKA_UI_PORT:-8080}:8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/actuator/health | grep -q UP']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  minio:
    # Fork comunitario de MinIO mantenido por Pigsty (las imágenes oficiales minio/minio
    # ya no se publican). Misma API S3 y mismas variables MINIO_*.
    image: pgsty/silo:RELEASE.2026-11-09T00-00-00Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  minio-init:
    image: pgsty/mc:RELEASE.2026-11-09T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev}
      S3_BUCKET_TESTCASES: ${S3_BUCKET_TESTCASES:-testcases}
      MC_CONFIG_DIR: /tmp/.mc
    volumes:
      - ./minio/create-buckets.sh:/scripts/create-buckets.sh:ro
    entrypoint: ['/bin/sh', '/scripts/create-buckets.sh']
    healthcheck:
      test: ['CMD', 'test', '-f', '/tmp/ready']
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  minio-data:
