name: web

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/contracts/graphql/**'
      - 'packages/config/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/_service-ci.yml'
      - '.github/workflows/web.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/contracts/graphql/**'
      - 'packages/config/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/_service-ci.yml'
      - '.github/workflows/web.yml'

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/_service-ci.yml
    permissions:
      contents: read
      packages: write # necesario para publicar en GHCR
    with:
      package: '@juez/web'
      path: apps/web
