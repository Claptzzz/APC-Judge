name: submissions

on:
  pull_request:
    paths:
      - 'services/submissions/**'
      - 'packages/contracts/**'
      - 'packages/config/**'
      - 'proto/**'
      - '.github/workflows/_service-ci.yml'
      - '.github/workflows/submissions.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'services/submissions/**'
      - 'packages/contracts/**'
      - 'packages/config/**'
      - 'proto/**'
      - '.github/workflows/_service-ci.yml'
      - '.github/workflows/submissions.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
  workflow_dispatch:

concurrency:
  group: submissions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/_service-ci.yml
    permissions:
      contents: read
      packages: write
    with:
      package: '@juez/submissions'
      path: services/submissions
