name: mcp

on:
  pull_request:
    paths:
      - 'services/mcp/**'
      - 'packages/contracts/**'
      - 'packages/config/**'
      - 'proto/**'
      - '.github/workflows/mcp.yml'
      - '.github/workflows/_service-ci.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'services/mcp/**'
      - 'packages/contracts/**'
      - 'packages/config/**'
      - 'proto/**'
      - '.github/workflows/mcp.yml'
      - '.github/workflows/_service-ci.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/_service-ci.yml
    permissions:
      contents: read
      packages: write # necesario para publicar en GHCR
    with:
      package: '@juez/mcp'
      path: services/mcp
