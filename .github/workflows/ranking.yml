name: ranking

on:
  pull_request:
    paths:
      - 'services/ranking/**'
      - 'packages/contracts/**'
      - 'packages/config/**'
      - 'proto/**'
      - '.github/workflows/_service-ci.yml'
      - '.github/workflows/ranking.yml'
  push:
    branches: [main]
    paths:
      - 'services/ranking/**'
      - 'packages/contracts/**'
      - 'packages/config/**'
      - 'proto/**'
      - '.github/workflows/_service-ci.yml'
      - '.github/workflows/ranking.yml'

concurrency:
  group: ranking-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/_service-ci.yml
    permissions:
      contents: read
      packages: write # necesario para publicar en GHCR
    with:
      package: '@juez/ranking'
      path: services/ranking
