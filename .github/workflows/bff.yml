name: bff

on:
  pull_request:
    paths:
      - 'apps/bff/**'
      - 'packages/contracts/**'
      - 'packages/config/**'
      - 'proto/**'
      - '.github/workflows/_service-ci.yml'
      - '.github/workflows/bff.yml'
  push:
    branches: [main]
    paths:
      - 'apps/bff/**'
      - 'packages/contracts/**'
      - 'packages/config/**'
      - 'proto/**'
      - '.github/workflows/_service-ci.yml'
      - '.github/workflows/bff.yml'

concurrency:
  group: bff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/_service-ci.yml
    permissions:
      contents: read
      packages: write
    with:
      package: '@juez/bff'
      path: apps/bff
