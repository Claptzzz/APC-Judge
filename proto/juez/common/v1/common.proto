syntax = "proto3";

package juez.common.v1;

// Lenguajes soportados por el judge.
enum Language {
  LANGUAGE_UNSPECIFIED = 0;
  LANGUAGE_CPP17 = 1;
  LANGUAGE_PYTHON3 = 2;
}

// Estado/resultado de una submission.
// PENDING y JUDGING son estados transitorios; el resto son veredictos finales.
enum Verdict {
  VERDICT_UNSPECIFIED = 0;
  VERDICT_PENDING = 1;
  VERDICT_JUDGING = 2;
  VERDICT_ACCEPTED = 3;
  VERDICT_WRONG_ANSWER = 4;
  VERDICT_TIME_LIMIT_EXCEEDED = 5;
  VERDICT_MEMORY_LIMIT_EXCEEDED = 6;
  VERDICT_RUNTIME_ERROR = 7;
  VERDICT_COMPILATION_ERROR = 8;
  VERDICT_INTERNAL_ERROR = 9;
}

// Rol del usuario. Viaja en el claim `role` del JWT.
enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_CONTESTANT = 1;
  ROLE_SETTER = 2;
  ROLE_ADMIN = 3;
}
